name: Makefile CI

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: env
      run: 
        sudo apt-get update
        sudo apt-get binutils bzip2 diff find flex gawk gcc-6+ getopt grep install libc-dev libz-dev make4.1+ perl python3.8+ rsync subversion unzip which
        sudo timedatectl set-timezone Asia/Shanghai

    - name: pull openwrt
      run: 
        git clone --depth=1 -b master https://github.com/openwrt/openwrt openwrt

    - name: pull openclash
      run: 
        cd openwrt
        git clone --depth=1 https://github.com/vernesong/OpenClash.git package/OpenClash
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config

    - name: refresh feeds
      run: 
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: make
      run: 
        cd openwrt
        make defconfig
        make download -j$(nproc)
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: build-${{ github.run_number }}
        files: openwrt/bin/targets/**/*
