name: Makefile CI

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - name: checkout github
      uses: actions/checkout@v7

    - name: env
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils bzip2 diffutils findutils flex gawk build-essential grep libc-dev libz-dev make4.1+ perl python3.8+ rsync subversion unzip which
        sudo timedatectl set-timezone Asia/Shanghai

    - name: pull openwrt
      run: |
        git clone --branch v25.12.6 --single-branch --depth=1 https://github.com/openwrt/openwrt.git openwrt

    - name: refresh feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: pull openclash
      run: |
        cd openwrt
        git clone --branch v0.48.002 --single-branch --depth=1 https://github.com/vernesong/OpenClash.git package/OpenClash
        cat >> .config <<'EOF'
        CONFIG_TARGET_ROOTFS_PARTSIZE=256
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF

    - name: add
      run: |
        sed 's/\r$//' config.txt | awk 'NF {print "CONFIG_PACKAGE_" $0 "=y"}' >> openwrt/.config
    
    - name: make
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        make -j$(nproc) || make -j1 V=s

    - name: date tag
      id: tag
      run: echo "date=$(TZ=Asia/Shanghai date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: build-${{ steps.tag.outputs.date }}
        files: openwrt/bin/targets/x86/64/*
