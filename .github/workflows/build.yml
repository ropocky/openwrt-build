name: Makefile CI

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: env
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils bzip2 diffutils findutils flex gawk build-essential grep libc-dev libz-dev make4.1+ perl python3.8+ rsync subversion unzip which
        sudo timedatectl set-timezone Asia/Shanghai

    - name: pull openwrt
      run: |
        git clone --branch v25.12.6 --single-branch --depth=1 https://github.com/openwrt/openwrt.git openwrt openwrt

    - name: pull openclash
      run: |
        cd openwrt
        git clone --branch v0.48.002 --single-branch --depth=1 https://github.com/vernesong/OpenClash.git package/OpenClash
        cat >> .config <<'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=4096
        CONFIG_PACKAGE_luci-app-openclash=y
        EOF
    
    - name: refresh feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: make
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: build-${{ github.run_number }}
        files: openwrt/bin/targets/x86/64/*
